  <style>
    html, body { margin: 0; height: 100%; background: #0a0a14; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #cfd2e8; font: 14px/1.7 ui-monospace, monospace; pointer-events: none;

    #boot .hint { font-size: 11px; opacity: .55; margin-top: 14px; }
    @keyframes bootGlow {
      0%, 100% { text-shadow: 0 0 20px #9a5cff66; }
      50% { text-shadow: 0 0 42px #b47affcc; }
    }
    @keyframes bootPulse { 0%, 100% { opacity: .9; } 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <div class="logo">QUIMERA</div>
